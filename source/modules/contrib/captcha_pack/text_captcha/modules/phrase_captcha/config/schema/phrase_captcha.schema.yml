phrase_captcha.settings:
  type: config_object
  label: 'Phrase CAPTCHA settings'
  mapping:
    phrase_captcha_words:
      type: integer
    phrase_captcha_userdefined_word_pool:
      type: string
    phrase_captcha_word_quantity:
      type: integer
    phrase_captcha_additional_word_quantity:
      type: integer
    phrase_captcha_word_selection_challenges:
      type: sequence
      sequence:
        type: string
