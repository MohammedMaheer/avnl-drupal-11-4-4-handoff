# This theme is marked as @internal. It is intended to evolve and change over
# minor releases.
# Change record https://www.drupal.org/node/2582945.
# As the UI of Drupal improves between minor versions, the markup and assets
# in the avnl_admin theme will change. The avnl_admin theme is not backwards compatible.
# If you wish to modify the output or assets of avnl_admin you can:
# 1. Copy the whole of avnl_admin and rename it as your own administration theme. You
# will need to manually manage your own updates if you want to stay up to
# date with avnl_admin's bug fixes and feature support.
#
# 2. Sub-theme avnl_admin. This is only recommended if you want to make minor tweaks
# and understand that avnl_admin could break your modifications as it changes.
name: AVNL Admin
type: theme
base theme: false
description: 'A clean, accessible, and powerful Drupal administration theme.'
alt text: 'Screenshot of avnl_admin, Drupal administration theme.'
package: Core
version: 
core_version_requirement: ^11
libraries:
  - core/drupal.message
  - core/normalize
  - avnl_admin/global-styling
libraries-override:
  system/base:
    css:
      component:
        css/components/ajax-progress.module.css: css/components/ajax-progress.module.css
        css/components/autocomplete-loading.module.css: css/components/autocomplete-loading.module.css
        css/components/system-status-counter.css: css/components/system-status-counter.css
        css/components/system-status-report-counters.css: css/components/system-status-report-counters.css
        css/components/system-status-report-general-info.css: css/components/system-status-report-general-info.css
        css/components/tabledrag.module.css: css/components/tabledrag.css

  system/admin:
    css:
      theme:
        css/system.admin.css: false

  core/drupal.dropbutton:
    css:
      component:
        misc/dropbutton/dropbutton.css: css/components/dropbutton.css

  core/drupal.vertical-tabs:
    css:
      component:
        misc/vertical-tabs.css: false

  core/drupal.autocomplete:
    css:
      theme:
        assets/vendor/jquery.ui/themes/base/theme.css: false

  core/drupal.tabbingmanager:
    css:
      theme:
        assets/vendor/jquery.ui/themes/base/theme.css: false

  core/drupal.dialog:
    css:
      component:
        assets/vendor/jquery.ui/themes/base/dialog.css: false
      theme:
        assets/vendor/jquery.ui/themes/base/theme.css: false

  user/drupal.user:
    css:
      component:
        css/user.module.css: false

  field_ui/drupal.field_ui:
    css:
      theme:
        css/field_ui.admin.css: css/theme/field-ui.admin.css

  node/drupal.node:
    css:
      layout:
        css/node.module.css: false

  toolbar/toolbar:
    css:
      component:
        css/toolbar.module.css: css/components/toolbar.module.css
      theme:
        css/toolbar.theme.css: css/theme/toolbar.theme.css
        css/toolbar.icons.theme.css: css/theme/toolbar.icons.theme.css

  toolbar/toolbar.menu:
    css:
      state:
        css/toolbar.menu.css: css/state/toolbar.menu.css

  views_ui/admin.styling:
    css:
      component:
        css/views_ui.admin.css: css/components/views_ui.admin.css
      theme:
        css/views_ui.admin.theme.css: css/theme/views_ui.admin.theme.css

libraries-extend:
  core/drupal.collapse:
    - avnl_admin/details-focus
  core/drupal.dialog:
    - avnl_admin/avnl_admin.drupal.dialog
    - avnl_admin/avnl_admin.jquery.ui
  core/drupal.dropbutton:
    - avnl_admin/dropbutton
  core/drupal.checkbox:
    - avnl_admin/checkbox
  core/drupal.message:
    - avnl_admin/messages
  core/drupal.progress:
    - avnl_admin/progress
  core/drupal.tabbingmanager:
    - avnl_admin/avnl_admin.jquery.ui
  core/drupal.tabledrag:
    - avnl_admin/avnl_admin.tabledrag
  core/drupal.vertical-tabs:
    - avnl_admin/vertical-tabs
  file/drupal.file:
    - avnl_admin/file
  filter/drupal.filter.admin:
    - avnl_admin/filter
  filter/drupal.filter:
    - avnl_admin/filter
  system/admin:
    - avnl_admin/system.admin
  core/drupal.autocomplete:
    - avnl_admin/autocomplete
    - avnl_admin/avnl_admin.jquery.ui
  tour/tour-styling:
    - avnl_admin/tour-styling
  shortcut/drupal.shortcut:
    - avnl_admin/drupal.shortcut
  core/drupal.ajax:
    - avnl_admin/ajax
  user/drupal.user:
    - avnl_admin/form.password-confirm
  views/views.module:
    - avnl_admin/views
  media/media_embed_ckeditor_theme:
    - avnl_admin/classy.media_embed_ckeditor_theme
  media_library/ui:
    - avnl_admin/media_library.ui
  media_library/view:
    - avnl_admin/media_library.theme
  media_library/widget:
    - avnl_admin/media_library.theme

regions:
  header: 'Header'
  pre_content: 'Pre-content'
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  help: Help
  content: Content
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  sidebar_first: 'First sidebar'
regions_hidden:
  - sidebar_first
